<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 260" width="880" height="260" role="img" aria-label="郑上进 · zhengshangjinx">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="55%" stop-color="#12304a"/>
      <stop offset="100%" stop-color="#0d5c63"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4fd1c5"/>
      <stop offset="100%" stop-color="#63b3ed"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#ffffff" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="880" height="260" rx="10" fill="url(#bg)"/>
  <rect width="880" height="260" rx="10" fill="url(#dots)"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
    <text x="56" y="104" fill="#ffffff" font-size="46" font-weight="700">郑上进</text>
    <text x="56" y="140" fill="#9fb3c8" font-size="19">zhengshangjinx</text>
    <rect x="56" y="164" width="64" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="56" y="204" fill="#cbd5e0" font-size="16">Java / Go 后端　·　微服务　·　数据与中间件</text>
  </g>

  <g>
    <rect x="620" y="60" width="212" height="140" rx="8" fill="#0a0f18" stroke="#1e3a4d"/>
    <rect x="620" y="60" width="212" height="26" rx="8" fill="#12212e"/>
    <rect x="620" y="78" width="212" height="8" fill="#12212e"/>
    <circle cx="636" cy="73" r="4" fill="#ff5f57"/>
    <circle cx="650" cy="73" r="4" fill="#febc2e"/>
    <circle cx="664" cy="73" r="4" fill="#28c840"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="638" y="112" fill="#4fd1c5">$ java -version</text>
      <text x="638" y="134" fill="#8fa3b8">openjdk 21.0.2</text>
      <text x="638" y="160" fill="#4fd1c5">$ go version</text>
      <text x="638" y="182" fill="#8fa3b8">go1.24 darwin/arm64</text>
